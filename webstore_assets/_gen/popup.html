<!doctype html>
<!--
  Renders the REAL extension popup (../../popup.html + ../../popup.js) with a
  fake chrome.* API, so store assets always match the shipped UI.
  Serve the repo root over HTTP, then open /webstore_assets/_gen/popup.html
-->
<meta charset="utf-8" />
<script>
  (async () => {
    const source = await (await fetch("/popup.html", { cache: "no-store" })).text();
    const html = source
      .replace("<head>", '<head><base href="/" />')
      .replace(
        '<script src="popup.js"><\/script>',
        '<script src="/webstore_assets/_gen/chrome-stub.js"><\/script>' +
          '<script src="/popup.js"><\/script>',
      );
    document.open();
    document.write(html);
    document.close();
  })();
</script>
