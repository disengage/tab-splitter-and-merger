<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #111318;
        --panel: #181b22;
        --panel-raised: #1f232c;
        --panel-hover: #262b36;
        --line: rgba(255, 255, 255, 0.07);
        --line-strong: rgba(255, 255, 255, 0.12);
        --ink: #eceef3;
        --muted: #8b93a5;
        --faint: #5d6575;
        --accent: #8b7cf6;
        --accent-strong: #a597ff;
        --accent-soft: rgba(139, 124, 246, 0.14);
        --accent-glow: rgba(139, 124, 246, 0.24);
        --accent-shadow: rgba(139, 124, 246, 0.3);
        --accent-border: rgba(139, 124, 246, 0.4);
        --focus-ring: #fff;
        color-scheme: dark;
        --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7fa;
          --panel: #efeff4;
          --panel-raised: #ffffff;
          --panel-hover: #e9e8f2;
          --line: rgba(20, 22, 40, 0.08);
          --line-strong: rgba(20, 22, 40, 0.14);
          --ink: #16181f;
          --muted: #5c6373;
          --faint: #8b91a0;
          --accent: #6d5ce8;
          --accent-strong: #5646d4;
          --accent-soft: rgba(109, 92, 232, 0.1);
          --accent-glow: rgba(109, 92, 232, 0.16);
          --accent-shadow: rgba(109, 92, 232, 0.28);
          --accent-border: rgba(109, 92, 232, 0.45);
          --focus-ring: #16181f;
          color-scheme: light;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        font-family: var(--font);
        font-size: 14px;
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        color: inherit;
        margin: 0;
      }

      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 8px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .section-label span:last-child {
        font-family: var(--mono);
        letter-spacing: 0;
        text-transform: none;
        font-weight: 400;
      }

      /* Move by domain: primary feature */
      .split {
        padding: 14px 14px 16px;
        background:
          radial-gradient(110% 120% at 100% 0%, var(--accent-glow), transparent 60%),
          var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .brand svg {
        width: 14px;
        height: 14px;
        color: var(--accent-strong);
      }

      .domain-info {
        margin-bottom: 16px;
      }

      .domain-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      #current-favicon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      #current-domain {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #domain-hint {
        margin: 4px 0 0 28px;
        font-size: 13px;
        color: var(--muted);
      }

      .split-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .split-buttons button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 6px 18px var(--accent-shadow);
        transition:
          background 0.12s ease,
          transform 0.12s ease,
          opacity 0.12s ease;
      }

      .split-buttons button:hover:not(:disabled) {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .split-buttons button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .split-buttons button:disabled {
        background: var(--panel-raised);
        color: var(--faint);
        box-shadow: inset 0 0 0 1px var(--line);
        cursor: not-allowed;
      }

      .split-buttons .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .split-buttons svg {
        width: 18px;
        height: 18px;
        opacity: 0.85;
      }

      .split-buttons .count {
        font-family: var(--mono);
        font-size: 12px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      .split-buttons button:disabled .count {
        background: var(--line);
      }

      .split-buttons .label {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .split-buttons .label strong {
        font-size: 14.5px;
        font-weight: 600;
      }

      .split-buttons .label span {
        font-size: 12px;
        opacity: 0.75;
      }

      /* Merge: bottom */
      .merge {
        padding: 12px 14px 14px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }

      #btn-merge {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--panel-raised);
        text-align: left;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }

      #btn-merge:hover:not(:disabled) {
        background: var(--panel-hover);
        border-color: var(--accent-border);
      }

      #btn-merge:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      #btn-merge:disabled {
        color: var(--faint);
        cursor: not-allowed;
      }

      #btn-merge svg {
        width: 16px;
        height: 16px;
        color: var(--accent-strong);
        flex-shrink: 0;
      }

      #btn-merge:disabled svg {
        color: var(--faint);
      }

      #btn-merge .label {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      #btn-merge .label strong {
        font-weight: 600;
      }

      #btn-merge .label span {
        font-size: 12px;
        color: var(--muted);
      }

      /* Preview: tertiary */
      .preview {
        padding: 12px 8px 8px;
      }

      .preview .section-label {
        padding: 0 6px;
      }

      #window-list {
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      #window-list::-webkit-scrollbar {
        width: 6px;
      }

      #window-list::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 999px;
      }

      .window-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        padding-right: 4px;
        border-radius: 8px;
        transition: background 0.12s ease;
      }

      .window-main {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        padding: 7px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .window-main:hover,
      .window-main:focus-visible {
        background: var(--panel-hover);
        outline: none;
      }

      .window-item.is-current .window-main:hover,
      .window-item.is-current .window-main:focus-visible {
        background: transparent;
      }

      .window-actions {
        display: flex;
        flex-shrink: 0;
        gap: 4px;
      }

      .window-actions button {
        padding: 4px 7px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--panel-raised);
        font-size: 11.5px;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }

      .window-actions button:hover:not(:disabled) {
        background: var(--panel-hover);
        border-color: var(--accent-border);
      }

      .window-actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .window-actions button:disabled {
        color: var(--faint);
        cursor: not-allowed;
      }

      .window-item.is-current {
        background: var(--accent-soft);
      }

      .window-item.is-current::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      .window-item .favicon {
        width: 24px;
        height: 24px;
        padding: 4px;
        border-radius: 6px;
        flex-shrink: 0;
        background: var(--panel-raised);
      }

      .window-item .details {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .window-item .details strong {
        font-size: 13.5px;
        font-weight: 600;
      }

      .window-item .details .meta {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab-badge {
        flex-shrink: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
      }

      .window-item.is-current .tab-badge {
        color: var(--accent-strong);
      }

      .empty-state {
        padding: 16px 12px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="split">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        Tab Split &amp; Merger
      </div>

      <div class="domain-info">
        <div class="domain-row">
          <img id="current-favicon" src="icons/icon16.png" alt="" />
          <strong id="current-domain">…</strong>
        </div>
        <p id="domain-hint">Move tabs to a new window</p>
      </div>

      <div class="split-buttons">
        <button id="btn-split-current" type="button">
          <span class="top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M12 3v18"></path>
            </svg>
            <span class="count" id="count-current">–</span>
          </span>
          <span class="label">
            <strong>From this window</strong>
          </span>
        </button>

        <button id="btn-split-all" type="button">
          <span class="top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M12 3v18"></path>
              <path d="M3 12h18"></path>
            </svg>
            <span class="count" id="count-all">–</span>
          </span>
          <span class="label">
            <strong>From all windows</strong>
          </span>
        </button>
      </div>
    </section>

    <section class="preview">
      <p class="section-label">
        <span>Windows</span>
        <span id="window-count"></span>
      </p>
      <div id="window-list"></div>
    </section>

    <section class="merge">
      <button id="btn-merge" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m8 6 4-4 4 4"></path>
          <path d="M12 2v10.3a4 4 0 0 1-1.17 2.83L4 22"></path>
          <path d="m20 22-5-5"></path>
        </svg>
        <span class="label">
          <strong>Merge All Windows</strong>
          <span id="merge-hint">Move every tab into the current window</span>
        </span>
      </button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
